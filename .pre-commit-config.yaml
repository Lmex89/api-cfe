repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint and import order
        entry: python scripts/check_standards.py lint
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: python scripts/check_standards.py format
        language: system
        types: [python]
      - id: mypy
        name: mypy type check
        entry: python scripts/check_standards.py types
        language: python
        language_version: python3.12
        additional_dependencies:
          - mypy==1.15.0
          - mypy-extensions==1.2.0
          - typing-extensions==4.16.0
          - annotated-doc==0.0.5
          - annotated-types==0.8.0
          - anyio==4.14.2
          - bcrypt==4.0.1
          - certifi==2026.7.22
          - cffi==2.1.1
          - charset-normalizer==3.4.9
          - click==8.4.2
          - cryptography==50.0.0
          - ecdsa==0.19.2
          - fastapi==0.141.1
          - greenlet==3.5.4
          - h11==0.16.0
          - httpcore==1.0.9
          - httpx==0.28.1
          - idna==3.18
          - loguru==0.7.3
          - passlib==1.7.4
          - pyasn1==0.6.4
          - pycparser==3.0
          - pydantic==2.13.4
          - pydantic-core==2.46.4
          - python-dotenv==1.2.2
          - python-jose==3.5.0
          - python-multipart==0.0.32
          - requests==2.34.2
          - rsa==4.9.1
          - six==1.17.0
          - sqlalchemy==2.0.51
          - starlette==1.3.1
          - typing-inspection==0.4.2
          - urllib3==2.7.0
          - uvicorn==0.52.1
        always_run: true
        require_serial: true
        types: [python]
