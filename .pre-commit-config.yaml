repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint and import order
        entry: python scripts/check_standards.py lint
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: python scripts/check_standards.py format
        language: system
        types: [python]
      - id: mypy
        name: mypy type check
        entry: python scripts/check_standards.py types
        language: system
        require_serial: true
        types: [python]
